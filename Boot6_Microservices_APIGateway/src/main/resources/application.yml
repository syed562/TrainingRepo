server:
  port: 8765

spring:
  application:
    name: APIGATEWAY

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # -------- AUTH SERVICE (NO JWT REQUIRED) ----------
        - id: AUTHSERVICE
          uri: lb://AUTHSERVICE
          predicates:
            - Path=/auth/**   # <-- FIXED THIS

        # -------- FLIGHT SERVICE ----------
        - id: FLIGHTSERVICE
          uri: lb://FLIGHTSERVICE
          predicates:
            - Path=/flight/**

        # -------- BOOKING SERVICE ----------
        - id: BOOKINGSERVICE
          uri: lb://BOOKINGSERVICE
          predicates:
            - Path=/booking/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

jwt:
  secret: Z3lK8s9P0q1R4u7X2b5N8m3C6v9T4r7E1u3P9x6L2q8W4s7D1c5V9b2K4m8J1
